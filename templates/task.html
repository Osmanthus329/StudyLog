{% extends 'header.html' %} {% block title %}Task{% endblock %} {% block content
%}
<h3>未完了タスク</h3>
<p>task_name | subject | deadline | priority | status | memo</p>
<ul class="list-group">
  {% for task in tasks %}
  <li class="list-group-item">
    <form method="POST" action="{{url_for('change_task_status')}}">
      <input
        class="form-check-input me-1"
        type="checkbox"
        name="task_id"
        value="{{task.id}}"
        onchange="this.form.submit()"
      />
    </form>
    <label class="form-check-label" for="firstCheckbox"
      >{{task.name}} {{task.subject.name}} {{task.deadline}} {{task.priority}}
      {{task.status}} {{task.memo}}
      <p>
        <a href="{{url_for('edit_task',id=task.id)}}" class="icon-link">
          Edit subject</a
        >
      </p></label
    >
  </li>
  {% endfor %}
</ul>
<a
  href="{{url_for('add_task')}}"
  class="btn btn-primary d-inline-flex align-items-center"
  type="button"
>
  Add Task
</a>
<h3>完了タスク</h3>
<ul class="list-group">
  {% for completed_task in completed_tasks %}

    <label class="form-check-label" for="firstCheckbox"
      >{{completed_task.name}} {{completed_task.subject.name}} {{completed_task.deadline}} {{completed_task.priority}}
      {{completed_task.status}} {{completed_task.memo}}
      <p>
         <a href="{{url_for('edit_task',id=completed_task.id)}}" class="icon-link">
          Edit subject</a
        >
      </p></label
    >
  </li>
  {% endfor %}
</ul>
{% endblock %}
